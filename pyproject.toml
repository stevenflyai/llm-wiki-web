[project]
name = "llm-wiki-web"
version = "0.2.0"
description = "LLM-driven personal wiki (raw/ → wiki/, with knowledge graph)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
filterwarnings = ["error::DeprecationWarning:llm_wiki"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["scripts/graph_build.py", "scripts/graph_routes.py"]
